<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="logo.svg" alt="" width="38" height="38">
        <span>EXAM Planner</span>
      </div>
      <div class="top-meta">
        <span class="dot"></span><span>PERSONAL STUDY DESK</span>
        <span style="opacity:.38">/</span><span>EXAM 2027</span>
      </div>
    </header>

    <div class="page-wrap">
      <div class="hero-heading fade-in">
        <div>
          <div class="eyebrow" id="hero-eyebrow"></div>
          <h1>One day at a time.</h1>
        </div>
        <div class="hero-actions">
          <div class="date-stamp" id="countdown"></div>
          <button class="export-btn" type="button" data-act="print">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg>
            Download full timetable
          </button>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" id="tab-plan" data-act="tab" data-tab="plan">Plan</button>
        <button role="tab" id="tab-progress" data-act="tab" data-tab="progress">Progress</button>
        <button role="tab" id="tab-tests" data-act="tab" data-tab="tests">Grand Tests</button>
      </nav>

      <section id="view-plan" role="tabpanel" aria-labelledby="tab-plan">
        <div class="dashboard-grid">
          <section class="paper today-card fade-in" id="today" aria-label="Today"></section>
          <section class="paper calendar-card" id="calendar" aria-label="Monthly study calendar"></section>
        </div>
        <div class="below-grid">
          <section class="paper preview-card" id="editor" aria-label="Selected day plan"></section>
          <aside class="side-stack" id="side"></aside>
        </div>
      </section>

      <section id="view-progress" role="tabpanel" aria-labelledby="tab-progress" hidden></section>
      <section id="view-tests" role="tabpanel" aria-labelledby="tab-tests" hidden></section>
    </div>
  </main>

  <div id="print-root" aria-hidden="true"></div>
  <div class="toast-msg" id="toast" role="status" hidden></div>
  <input type="file" id="file-input" accept="application/json,.json" hidden>

  <script src="plan-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
